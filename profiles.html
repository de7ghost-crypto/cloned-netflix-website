<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who's watching? | Netflix</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="profiles-page">

  <header>
    <a href="profiles.html" class="logo">NETFLIX</a>
  </header>

  <main>
    <h1>Who's watching?</h1>

    <ul class="profile-list">
      <li>
        <a class="profile" href="home.html">
          <span class="pic"><img src="images/Netflix.jpg" alt=""></span>
          <span>You</span>
        </a>
      </li>
      <li>
        <a class="profile" href="home.html">
          <span class="pic"><img src="images/movie board.jpg" alt=""></span>
          <span>Family</span>
        </a>
      </li>
      <li>
        <a class="profile" href="home.html">
          <span class="pic"><img src="images/download (8).jpg" alt=""></span>
          <span>Kids</span>
        </a>
      </li>
      <li>
        <a class="profile" href="#">
          <span class="pic add">+</span>
          <span>Add Profile</span>
        </a>
      </li>
    </ul>

    <a class="manage" href="#">Manage Profiles</a>
  </main>

</body>
</html>
